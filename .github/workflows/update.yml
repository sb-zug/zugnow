name: Daten aktualisieren & veröffentlichen

on:
  schedule:
    - cron: "7 5,12 * * *"   # 2× täglich: ca. 06:07 und 13:07 Zürich (Winterzeit; Sommer je +1 h)
  workflow_dispatch:          # «Run workflow» von Hand
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sammler ausführen
        env:
          EVENTFROG_API_KEY: ${{ secrets.EVENTFROG_API_KEY }}
        run: python collector/collect.py

      - name: Neue Daten speichern
        run: |
          git config user.name "zug.now bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Daten $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
